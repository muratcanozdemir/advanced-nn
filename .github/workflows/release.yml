name: Release

# Builds the memstore wheel and sdist, exports a CycloneDX SBOM from uv.lock, and signs both a SLSA build
# provenance attestation and an SBOM attestation for each dist file (Sigstore, via GitHub artifact
# attestations). A v* tag also publishes a GitHub release; workflow_dispatch builds and attests only.
# Verify with: gh attestation verify <file> --repo muratcanozdemir/advanced-nn   (see RUNBOOK.md)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Sigstore signing certificate
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: false # no cache restore into a release build
      - name: Check tag matches pyproject version
        if: github.ref_type == 'tag'
        run: |
          version=$(uv version --short)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match pyproject version $version"
            exit 1
          fi
      - run: uv build --out-dir dist
      - name: Export SBOM (CycloneDX 1.5, runtime dependencies)
        run: uv export --locked --no-dev --format cyclonedx1.5 > sbom.cdx.json
      - name: Attest build provenance (SLSA v1)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*
          sbom-path: sbom.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: |
            dist/
            sbom.cdx.json

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* sbom.cdx.json --repo "$GITHUB_REPOSITORY" --generate-notes --verify-tag
