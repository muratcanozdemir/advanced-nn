name: Release

# Builds the memstore wheel and sdist, exports a CycloneDX SBOM from uv.lock, and signs both a SLSA build
# provenance attestation and an SBOM attestation for each dist file (Sigstore, via GitHub artifact
# attestations). A v* tag also publishes a GitHub release; workflow_dispatch builds and attests only.
# Verify with: gh attestation verify <file> --repo muratcanozdemir/advanced-nn   (see RUNBOOK.md)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Sigstore signing certificate
      attestations: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: false # no cache restore into a release build
      - name: Check tag matches pyproject version
        if: github.ref_type == 'tag'
        run: |
          version=$(uv version --short)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match pyproject version $version"
            exit 1
          fi
      - run: uv build --out-dir dist
      - name: Export SBOM (CycloneDX 1.5, runtime dependencies)
        run: uv export --locked --no-dev --format cyclonedx1.5 > sbom.cdx.json
      - name: Attest build provenance (SLSA v1)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*
          sbom-path: sbom.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: |
            dist/
            sbom.cdx.json

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* sbom.cdx.json --repo "$GITHUB_REPOSITORY" --generate-notes --verify-tag
