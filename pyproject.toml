[project]
name = "advanced-nn"
version = "0.1.0"
description = "Runnable examples: FFN and attention as one memory-lookup operation"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "torch>=2.5",
    "matplotlib>=3.9",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["memstore"]

# CPU-only torch: avoids pulling multi-GB CUDA wheels on a machine without an NVIDIA GPU.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# E501: the formatter owns line length; B905: zip(strict=) adds noise to tensor code.
ignore = ["E501", "B905"]
